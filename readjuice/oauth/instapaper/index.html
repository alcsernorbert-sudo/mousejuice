<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>ReadJuice – Instapaper sign-in</title>
<style>
  body { font: 17px -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; margin: 0; min-height: 100vh;
         display: flex; align-items: center; justify-content: center; text-align: center;
         background: linear-gradient(#ff9646, #d6344e); color: #fff; }
  a { color: #fff; font-weight: 600; }
</style>
</head>
<body>
<main>
  <p>Returning to ReadJuice…</p>
  <p><a id="open" href="hu.alcser.readjuice://oauth/instapaper">Open ReadJuice</a></p>
</main>
<script>
  // Instapaper only accepts https callbacks: hand the authorization result (code/state or error) to the app.
  var target = "hu.alcser.readjuice://oauth/instapaper" + window.location.search;
  document.getElementById("open").href = target;
  window.location.replace(target);
</script>
</body>
</html>
